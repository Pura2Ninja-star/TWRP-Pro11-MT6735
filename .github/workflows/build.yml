name: Build TWRP Pro11

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch TWRP (twrp-11 / twrp-12.1 / twrp-9.0 / twrp-7.1)"
        default: "twrp-11"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Kosongkan disk runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Install dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python-is-python3 openjdk-8-jdk lz4 ccache bc
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"

      - name: Python 2 untuk branch lama
        run: |
          BR="${{ github.event.inputs.branch }}"
          if [ "$BR" = "twrp-7.1" ] || [ "$BR" = "twrp-9.0" ]; then
            sudo apt-get install -y python2
            sudo apt-get remove -y python-is-python3
            sudo ln -sf /usr/bin/python2 /usr/bin/python
          fi

      - name: Sync source TWRP
        run: |
          export PATH=$HOME/bin:$PATH
          BR="${{ github.event.inputs.branch }}"
          mkdir -p ~/twrp && cd ~/twrp
          if [ "$BR" = "twrp-7.1" ] || [ "$BR" = "twrp-9.0" ]; then
            MAN=platform_manifest_twrp_omni
          else
            MAN=platform_manifest_twrp_aosp
          fi
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/$MAN.git -b $BR
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Pasang device tree
        run: |
          BR="${{ github.event.inputs.branch }}"
          mkdir -p ~/twrp/device/xsd
          cp -r $GITHUB_WORKSPACE/device/xsd/Pro11 ~/twrp/device/xsd/Pro11
          if [ "$BR" = "twrp-7.1" ] || [ "$BR" = "twrp-9.0" ]; then
            cd ~/twrp/device/xsd/Pro11
            cp twrp_Pro11.mk omni_Pro11.mk
            sed -i 's/twrp_Pro11/omni_Pro11/g; s#vendor/twrp/config/common.mk#build/target/product/full_base.mk#' omni_Pro11.mk
            sed -i 's/twrp_Pro11/omni_Pro11/g' AndroidProducts.mk vendorsetup.sh
          fi

      - name: Build recovery
        run: |
          set -o pipefail
          export LC_ALL=C
          export ALLOW_MISSING_DEPENDENCIES=true
          cd ~/twrp
          source build/envsetup.sh
          BR="${{ github.event.inputs.branch }}"
          if [ "$BR" = "twrp-7.1" ] || [ "$BR" = "twrp-9.0" ]; then
            export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
            lunch omni_Pro11-eng
          else
            lunch twrp_Pro11-eng
          fi
          # Lanjut walau gagal di cek ukuran; langkah berikutnya memangkas ramdisk.
          mka recoveryimage -j$(nproc) 2>&1 | tee ~/build.log || true

      - name: Pangkas dan susun ulang image agar muat 16 MB
        if: always()
        run: |
          set -euo pipefail
          OUT=$HOME/twrp/out/target/product/Pro11
          ROOT=$OUT/recovery/root
          HOST=$HOME/twrp/out/host/linux-x86/bin
          LIMIT=16711680   # 16 MB dikurangi margin 64 KB
          mkdir -p $HOME/final
          REPORT=$HOME/final/laporan.txt
          : > $REPORT

          NATIVE=$OUT/recovery.img
          if [ -f "$NATIVE" ] && [ "$(stat -c %s "$NATIVE")" -le "$LIMIT" ]; then
            cp "$NATIVE" $HOME/final/recovery.img
            echo "Image bawaan build sudah muat: $(stat -c %s "$NATIVE") byte" | tee -a $REPORT
            exit 0
          fi

          if [ ! -f "$ROOT/system/bin/recovery" ] && [ ! -f "$ROOT/sbin/recovery" ]; then
            echo "Binary recovery tidak ada di ramdisk. Build belum benar." | tee -a $REPORT
            exit 1
          fi
          if [ ! -f "$OUT/kernel" ]; then
            echo "Kernel tidak ditemukan di $OUT/kernel" | tee -a $REPORT
            exit 1
          fi

          rm -rf $HOME/work && mkdir -p $HOME/work
          cp -a "$ROOT" $HOME/work/root

          pack() {
            "$HOST/mkbootfs" -d "$OUT/system" $HOME/work/root > $HOME/work/r.cpio
            gzip -9n < $HOME/work/r.cpio > $HOME/work/r.img
            "$HOST/mkbootimg" --kernel "$OUT/kernel" --ramdisk $HOME/work/r.img \
              --cmdline "bootopt=64S3,32N2,32N2" --base 0x40000000 --pagesize 2048 \
              --kernel_offset 0x00008000 --ramdisk_offset 0x04000000 \
              --second_offset 0x00f00000 --tags_offset 0x0e000000 \
              --os_version 7.0.0 --os_patch_level 2017-12 \
              --output $HOME/work/recovery.img
            stat -c %s $HOME/work/recovery.img
          }

          STEPS=(
            "App TWRP|system/bin/me.twrp.twrpapp.apk system/bin/privapp-permissions-twrpapp.xml"
            "fastbootd|system/bin/fastbootd system/lib/android.hardware.fastboot@1.0.so"
            "Bahasa tambahan (sisakan en dan id)|LANG"
            "bash|system/bin/bash"
            "Alat exFAT dan FAT|system/bin/exfat-fuse system/bin/fsck.exfat system/bin/mkexfatfs system/bin/fatlabel system/bin/fsck.fat system/bin/mkfs.fat"
            "Layanan HAL boot dan health|system/bin/android.hardware.boot@1.0-service system/bin/android.hardware.boot@1.1-service system/bin/android.hardware.health@2.1-service"
          )

          SIZE=$(pack)
          echo "Ukuran awal setelah susun ulang: $SIZE byte (batas $LIMIT)" | tee -a $REPORT

          for step in "${STEPS[@]}"; do
            if [ "$SIZE" -le "$LIMIT" ]; then break; fi
            label=${step%%|*}
            paths=${step#*|}
            if [ "$paths" = "LANG" ]; then
              find $HOME/work/root/twres/languages -type f ! -name en.xml ! -name id.xml -delete 2>/dev/null || true
            else
              for p in $paths; do rm -f "$HOME/work/root/$p"; done
            fi
            SIZE=$(pack)
            echo "Dihapus: $label -> $SIZE byte" | tee -a $REPORT
          done

          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "MASIH TERLALU BESAR: $SIZE byte. File terbesar di ramdisk:" | tee -a $REPORT
            du -ab $HOME/work/root | sort -rn | head -40 | tee -a $REPORT
            exit 1
          fi

          cp $HOME/work/recovery.img $HOME/final/recovery.img
          echo "SELESAI. Ukuran akhir: $SIZE byte" | tee -a $REPORT
          ls -l $HOME/final | tee -a $REPORT

      - name: Ringkasan hasil
        if: always()
        run: |
          {
            echo "=== Ukuran image ==="
            ls -l ~/twrp/out/target/product/Pro11/*.img ~/final/* 2>&1
            echo
            echo "=== File terbesar di ramdisk recovery ==="
            du -ab ~/twrp/out/target/product/Pro11/recovery/root 2>/dev/null | sort -rn | head -40
            echo
            echo "=== Pesan error penting ==="
            grep -iE "error:|FAILED" ~/build.log | head -40
          } > ~/ringkasan.txt 2>&1 || true
          cat ~/ringkasan.txt

      - name: Simpan log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/build.log
            ~/ringkasan.txt
            ~/final/laporan.txt

      - name: Simpan hasil recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Pro11-${{ github.event.inputs.branch }}
          path: ~/final/recovery.img
          if-no-files-found: warn